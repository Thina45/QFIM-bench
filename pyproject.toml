[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfim-bench"
version = "1.1.0"
description = "Reproducible benchmarking of Grover-based quantum frequent itemset mining on simulators and IBM Quantum hardware."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Thinakaran P", email = "thinakaran@pregasusnexus.com" },
    { name = "Parthiban K" },
]
keywords = ["quantum computing", "frequent itemset mining", "Grover", "NISQ", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "qiskit-ibm-runtime>=0.25",  # also provides the FakeMarrakesh noise model used by NoisySimulatorBackend
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "mlxtend>=0.23",
]

[project.urls]
Repository = "https://github.com/Thina45/QFIM-bench"
Issues = "https://github.com/Thina45/QFIM-bench/issues"
Documentation = "https://github.com/Thina45/QFIM-bench/blob/main/docs/API.md"

[project.optional-dependencies]
hardware = []  # IBM Quantum access uses the core qiskit-ibm-runtime install; set IBM_QUANTUM_TOKEN to use it
dev = ["pytest>=7.0", "pytest-cov"]
dashboard = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["qfim_bench"]
