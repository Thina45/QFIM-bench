[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qfim_bench"
version = "1.0.1"
description = "Reproducible benchmarking of Grover-based quantum frequent itemset mining on simulators and IBM Quantum hardware."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Thinakaran P", email = "thinakaran@pregasusnexus.com" }]
keywords = ["quantum computing", "frequent itemset mining", "Grover", "NISQ", "reproducibility"]
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "qiskit-ibm-runtime>=0.25",  # also provides the FakeMarrakesh noise model used by NoisySimulatorBackend
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "mlxtend>=0.23",
]

[project.optional-dependencies]
hardware = []  # IBM Quantum access uses the core qiskit-ibm-runtime install; set IBM_QUANTUM_TOKEN to use it
dev = ["pytest>=7.0", "pytest-cov"]
dashboard = ["streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["qfim_bench"]
