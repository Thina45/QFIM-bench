name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # Tests never contact IBM Quantum (hardware tests are mocked). Make that structural:
      # no token is available to the test process.
      IBM_QUANTUM_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package with the tested Qiskit versions
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
          pip install qiskit==2.1.2 qiskit-aer==0.17.2 qiskit-ibm-runtime==0.41.1
      - name: Run tests with coverage
        run: pytest -q -W ignore --cov=qfim_bench --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          rate = float(ET.parse("coverage.xml").getroot().get("line-rate"))
          print(f"line coverage: {rate:.1%}")
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  latest-deps:
    name: latest dependencies (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      IBM_QUANTUM_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q -W ignore
